<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Agile Minimalista 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- VELOCÍMETRO GIGANTE (ESQUERDA) --- */
        .speed-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 40%;
            margin-left: 5%;
        }

        .speed-value {
            font-size: 16rem; /* Tamanho Gigante */
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px #ff003c, 0 0 50px #ff003c;
            line-height: 0.9;
        }

        .speed-unit {
            font-size: 3rem;
            color: #ff003c;
            letter-spacing: 10px;
            text-shadow: 0 0 10px #ff003c;
            margin-top: 10px;
        }

        /* --- CARRO E PISTA 3D (DIREITA) --- */
        .car-track-container {
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            perspective: 600px; /* Cria a ilusão de profundidade 3D */
        }

        /* O Chão/Pista */
        .track {
            position: absolute;
            bottom: -50px;
            width: 100%;
            height: 80%;
            /* Fundo escuro esfumaçado simulando asfalto à noite */
            background: linear-gradient(to bottom, transparent 0%, #0a0a0a 40%, #151515 100%);
            transform: rotateX(60deg); /* Deita a pista para trás */
            transform-origin: bottom center;
            border-left: 2px solid rgba(255, 0, 60, 0.2);
            border-right: 2px solid rgba(255, 0, 60, 0.2);
            z-index: 0;
            overflow: hidden;
        }

        /* As faixas da pista */
        .track-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(
                to bottom,
                transparent 0,
                transparent 50px,
                rgba(255, 255, 255, 0.7) 50px,
                rgba(255, 255, 255, 0.7) 120px
            );
            background-size: 16px 100%; /* Largura da faixa branca */
            background-position: center 0;
            background-repeat: no-repeat;
        }

        /* A imagem do Agile */
        #carroImg {
            width: 320px; /* Um pouco maior para dar mais destaque */
            z-index: 2;
            margin-bottom: 50px;
            /* Máscara para tirar a borda preta quadrada da IA e misturar com a pista */
            mask-image: radial-gradient(circle at center, black 50%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 50%, transparent 80%);
        }

        /* --- ANIMAÇÕES --- */
        
        /* Faixa da pista rolando em loop */
        @keyframes scrollRoad {
            from { background-position: center 0px; }
            to { background-position: center 120px; }
        }

        /* Vibração do motor ligado (parado) */
        @keyframes idleVibration {
            0% { transform: translateY(0px); }
            50% { transform: translateY(1px); }
            100% { transform: translateY(0px); }
        }

        /* Tremida forte da suspensão (andando) */
        @keyframes drivingVibration {
            0% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-4px) rotate(-1deg); }
            50% { transform: translateY(2px) rotate(0deg); }
            75% { transform: translateY(-3px) rotate(1deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Classes ativadas pelo Javascript */
        .carro-parado { 
            animation: idleVibration 0.1s infinite; 
        }
        
        .carro-andando { 
            animation: drivingVibration 0.3s infinite; 
        }
        
        .pista-movimento {
            animation: scrollRoad 0.3s linear infinite;
        }
    </style>
</head>
<body>

    <!-- VELOCÍMETRO GIGANTE -->
    <div class="speed-container">
        <div class="speed-value" id="velocidadeTxt">0</div>
        <div class="speed-unit">KM/H</div>
    </div>

    <!-- PISTA E CARRO -->
    <div class="car-track-container">
        <div class="track">
            <!-- A linha do meio que vai se mover -->
            <div id="trackLines" class="track-lines"></div>
        </div>
        
        <!-- Sua imagem do Agile -->
        <img id="carroImg" class="carro-parado" src="https://i.postimg.cc/NMdqrfFt/Gemini-Generated-Image-nw2u48nw2u48nw2u.jpg" alt="Carro Agile">
    </div>

    <script>
        const velDisplay = document.getElementById('velocidadeTxt'); 
        const carroImg = document.getElementById('carroImg');
        const trackLines = document.getElementById('trackLines');

        function iniciarGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    function(position) {
                        // Converte velocidade de m/s para Km/h
                        let velMetrosPorSegundo = position.coords.speed;
                        let velKmH = 0;

                        // Se a velocidade for maior que 1 km/h (corta ruídos do GPS)
                        if (velMetrosPorSegundo !== null && velMetrosPorSegundo > 0.3) {
                            velKmH = Math.round(velMetrosPorSegundo * 3.6); 
                        }

                        // Atualiza o texto na tela
                        velDisplay.innerText = velKmH;

                        // Lógica de Movimento da Pista e do Carro
                        if (velKmH > 0) {
                            carroImg.className = 'carro-andando';
                            trackLines.className = 'track-lines pista-movimento';
                        } else {
                            carroImg.className = 'carro-parado';
                            trackLines.className = 'track-lines'; // Para a pista
                        }
                    },
                    function(error) {
                        console.error("Aguardando sinal de GPS do celular...", error);
                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 5000
                    }
                );
            }
        }

        // Inicia o GPS
        iniciarGPS();
    </script>
</body>
</html>
