<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chevrolet Agile LTZ - Dashboard</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Michroma&family=Orbitron:wght@400;700;900&family=Oxanium:wght@300;400;700&display=swap');

        :root {
            --neon-red: #ff0033;
            --neon-red-glow: rgba(255, 0, 51, 0.6);
            --bg-dark: #000000;
            
            /* =========================================
               AJUSTE MILIMÉTRICO DAS LANTERNAS AQUI!
               Se ficar um pouco fora, mude esses números:
               ========================================= */
            --altura-lanterna: 34%;   /* Aumente para subir, diminua para descer */
            --lateral-lanterna: 28%;  /* Aumente para ir pro centro, diminua para ir pras pontas */
        }

        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background-color: #000000 !important; 
            overflow: hidden; user-select: none;
        }

        .multimedia-screen {
            width: 100vw; height: 100vh; background: #000000 !important;
            position: relative; overflow: hidden;
        }

        /* MENUS */
        .menu-container { position: absolute; top: 4%; left: 4%; z-index: 100; display: flex; flex-direction: column; gap: 10px; }
        .menu-toggle { background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 0, 51, 0.5); color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; }
        .menu-toggle.active { background: rgba(255, 0, 51, 0.2); box-shadow: 0 0 15px var(--neon-red-glow); }
        .menu-line { width: 20px; height: 2px; background-color: #fff; transition: all 0.3s ease; }
        .top-nav { display: flex; flex-direction: column; gap: 10px; opacity: 0; pointer-events: none; transform: translateX(-20px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .top-nav.open { opacity: 1; pointer-events: auto; transform: translateX(0); }
        .nav-btn { background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 0, 51, 0.3); color: #fff; font-family: 'Michroma', sans-serif; font-size: 12px; padding: 10px 20px; border-radius: 12px; cursor: pointer; }
        .nav-btn.active { background: rgba(255, 0, 51, 0.15); border-color: var(--neon-red); box-shadow: 0 0 20px var(--neon-red-glow); color: var(--neon-red); }

        .view-section { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        .view-section.active { display: block; }

        /* =========================================
           PAINEL 3D
           ========================================= */
        #view-panel { background: #000000 !important; }

        /* DATA E HORA (FORMATO DO VELOCÍMETRO) */
        .top-right-container { position: absolute; top: 4%; right: 4%; z-index: 100; display: flex; align-items: flex-start; gap: 15px; }
        .datetime-block { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        
        .time-text { font-family: 'Arial', sans-serif !important; font-size: clamp(28px, 4.5vh, 45px); font-weight: 900; color: #ffffff; text-shadow: 0 0 10px var(--neon-red), 0 0 25px var(--neon-red); line-height: 1; }
        .date-text { font-family: 'Arial', sans-serif !important; font-size: clamp(16px, 2.5vh, 22px); font-weight: 700; color: #ffffff; text-shadow: 0 0 10px var(--neon-red), 0 0 20px var(--neon-red); line-height: 1; }

        .fullscreen-btn { background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 0, 51, 0.5); width: 40px; height: 40px; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .fullscreen-btn svg { width: 22px; height: 22px; stroke: #fff; }

        /* VELOCÍMETRO (GIGANTE, ARIAL PARA O ZERO NÃO BUGAR) */
        .speed-container-new { 
            position: absolute; left: 8vw; top: 50%; transform: translateY(-50%); 
            display: flex; flex-direction: column; align-items: center; z-index: 10;
        }
        .speed-value-new { 
            font-family: 'Arial', sans-serif !important; 
            font-size: clamp(140px, 35vh, 350px); 
            font-weight: 900; 
            color: #fff; 
            text-shadow: 0 0 15px var(--neon-red), 0 0 40px var(--neon-red), 0 0 80px var(--neon-red); 
            line-height: 0.85; 
        }
        .speed-unit-new { 
            font-family: 'Arial', sans-serif !important; font-size: clamp(25px, 5vh, 45px); 
            color: var(--neon-red); letter-spacing: 15px; text-shadow: 0 0 10px var(--neon-red); 
            margin-top: 15px; font-weight: 900;
        }

        /* =========================================
           PISTA (VAI ATÉ O TETO)
           ========================================= */
        .track-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            perspective: 50vh; 
            perspective-origin: 50% 15%; 
            display: flex; justify-content: center; z-index: 1; overflow: hidden;
        }
        
        .track {
            position: absolute; bottom: -20vh; width: 80vw; 
            height: 300vh; /* Altura absurda para furar o teto */
            background: #000000; 
            transform-origin: bottom center;
            transform: rotateX(82deg);
            border-left: 6px solid #ffffff; 
            border-right: 6px solid #ffffff; 
        }

        .track-lines {
            position: absolute; left: 50%; transform: translateX(-50%);
            width: 10px; height: 100%;
            background-image: linear-gradient(to bottom, #fff 50%, transparent 50%);
            background-size: 100% 30vh;
        }

        /* =========================================
           CARRO, FARÓIS E LANTERNAS BLINDADOS
           ========================================= */
        .car-wrapper {
            position: absolute; 
            bottom: -5vh; /* Colado na base */
            left: 50%; transform: translateX(-50%);
            width: clamp(350px, 55vh, 600px); /* CARRO GIGANTE */
            aspect-ratio: 1 / 1; 
            display: block; z-index: 10;
        }

        #carroImg {
            width: 100%; display: block; position: relative; z-index: 4;
            /* Sombra projetada abaixo do carro para dar volume real */
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.5));
        }

        /* FAROL DIANTEIRO EM VETOR (100% A PROVA DE BUGS) */
        /* Nasce exatamente da mesma altura das lanternas traseiras */
        .headlight-svg {
            position: absolute;
            bottom: var(--altura-lanterna); 
            left: 0;
            width: 100%;
            height: 150vh; /* Joga a luz até o teto da tela */
            z-index: 1; /* Fica atrás do carro */
            overflow: visible;
        }

        /* LANTERNAS TRASEIRAS CRAVADAS (Pequenas e Redondinhas) */
        .taillight {
            position: absolute; 
            bottom: var(--altura-lanterna); /* Usa o ajuste lá do topo */
            width: 25px; /* Tamanho Fixo Redondo */
            height: 25px; 
            background: #ffffff; /* Núcleo Branco */
            border-radius: 50%;
            /* Brilho: Halo branco, Vermelho intenso, Vermelho espalhado */
            box-shadow: 0 0 5px #fff, 0 0 15px 8px #ff0000, 0 0 45px 20px #ff0033;
            z-index: 5; opacity: 1; 
        }
        /* Usa o ajuste horizontal lá do topo */
        .taillight.left { left: var(--lateral-lanterna); } 
        .taillight.right { right: var(--lateral-lanterna); }

        /* =========================================
           ANIMAÇÕES (TREPIDAÇÃO REALISTA)
           ========================================= */
        @keyframes scrollRoad { from { background-position: center 0; } to { background-position: center 30vh; } }
        
        @keyframes idleVibration { 
            0% { transform: translateX(-50%) translateY(0px); } 
            50% { transform: translateX(-50%) translateY(1px); } 
            100% { transform: translateX(-50%) translateY(0px); } 
        }
        
        @keyframes drivingVibration { 
            0% { transform: translateX(-50%) translateY(0px) rotate(0deg); } 
            25% { transform: translateX(-50%) translateY(-3px) rotate(-0.5deg); } 
            50% { transform: translateX(-50%) translateY(1px) rotate(0deg); } 
            75% { transform: translateX(-50%) translateY(-2px) rotate(0.5deg); } 
            100% { transform: translateX(-50%) translateY(0px) rotate(0deg); } 
        }

        .carro-andando { animation: drivingVibration 0.3s infinite; }
        .carro-parado { animation: idleVibration 0.1s infinite; } 
        .pista-movimento { animation: scrollRoad 0.3s linear infinite; }

        /* =========================================
           TEMA CLARO E OUTRAS ABAS
           ========================================= */
        #view-panel.light-mode { background: #e2e8f0 !important; }
        #view-panel.light-mode .speed-value-new, #view-panel.light-mode .speed-unit-new, #view-panel.light-mode .time-text, #view-panel.light-mode .date-text { color: #1e293b !important; text-shadow: none !important; }
        #view-panel.light-mode .track { background: #94a3b8; border-color: #475569; }
        #view-panel.light-mode .track-lines { background-image: linear-gradient(to bottom, #475569 50%, transparent 50%); }
        #view-panel.light-mode #carroImg { filter: drop-shadow(0 15px 15px rgba(0,0,0,0.2)); } /* Sombra mais fraca no claro */
        #view-panel.light-mode .headlight-svg, #view-panel.light-mode .taillight { opacity: 0; }

        #view-logo { display: none; }
        #view-car { display: none; }
        #view-logo.active { display: flex; justify-content: center; background: radial-gradient(circle at center, rgba(255,0,51,0.2) 0%, #000 70%); }
        #view-logo .logo-img-large { width: 100vw; height: 100vh; object-fit: cover; object-position: center; mix-blend-mode: screen; }
        #view-car.active { display: flex; background: var(--bg-dark); }
        .full-screen-display { display: flex; width: 100vw; height: 100vh; }
        .side-menu { width: 25vw; min-width: 250px; background: rgba(5,5,5,0.9); border-right: 1px solid rgba(255, 0, 51, 0.3); display: flex; flex-direction: column; padding: 80px 0 20px 0; z-index: 10; }
        .side-menu-btn { background: none; border: none; color: #aaa; text-align: left; padding: 20px 25px; font-size: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; transition: 0.2s; }
        .side-menu-btn:hover { background: rgba(255, 0, 51, 0.05); color: #fff; }
        .side-menu-btn.active { background: rgba(255, 0, 51, 0.1); color: var(--neon-red); font-weight: 700; border-left: 4px solid var(--neon-red); }
        .content-area { flex-grow: 1; padding: 4% 5%; display: flex; flex-direction: column; background: radial-gradient(circle at right, rgba(255,0,51,0.05) 0%, transparent 60%); position: relative; }
        .info-section { display: none; flex-direction: column; height: 100%; width: 62%; justify-content: flex-start; padding: 1% 0; overflow-y: auto; }
        .info-section.active { display: flex; }
        .info-title { font-family: 'Michroma', sans-serif; font-size: 40px; color: var(--neon-red); text-shadow: 0 0 15px var(--neon-red-glow); margin-bottom: 25px; border-bottom: 1px solid rgba(255,0,51,0.3); padding-bottom: 10px; }
        .info-box { background: rgba(15, 5, 5, 0.7); border: 1px solid rgba(255, 0, 51, 0.2); border-radius: 12px; padding: 15px 20px; margin-bottom: 12px; }
        .info-box-content { font-size: 18px; color: #ccc; }
        .info-box-content strong { color: #fff; font-family: 'Oxanium', sans-serif; margin-right: 8px; }
        .car-images-container { position: absolute; right: 2%; top: 5%; bottom: 5%; width: 33%; display: flex; flex-direction: column; gap: 20px; opacity: 0.7; }
        .car-image-box { flex: 1; border-radius: 15px; border: 1px solid rgba(255,0,51,0.1); background: rgba(10,10,10,0.5); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .car-image-box img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: screen; }
    </style>
</head>
<body>
<div class="multimedia-screen">

    <div class="menu-container">
        <button class="menu-toggle" onclick="toggleMenu()" id="menu-btn">
            <div class="menu-line line1"></div>
            <div class="menu-line line2"></div>
            <div class="menu-line line3"></div>
        </button>
        <div class="top-nav" id="main-nav">
            <button class="nav-btn active" onclick="switchView('view-panel', this)">PAINEL</button>
            <button class="nav-btn" onclick="switchView('view-logo', this)">LOGO / MÍDIA</button>
            <button class="nav-btn" onclick="switchView('view-car', this)">MEU AGILE</button>
        </div>
    </div>

    <!-- ABA 1: PAINEL 3D PERFEITO E ANTI-BUG -->
    <div id="view-panel" class="view-section active">
        
        <div class="top-right-container">
            <div class="datetime-block">
                <div id="time-display" class="time-text">--:--:--</div>
                <div id="date-display" class="date-text">--/--/----</div>
            </div>
            
            <button class="fullscreen-btn" onclick="toggleFullScreen()" title="Tela Cheia">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
            </button>
        </div>

        <div class="speed-container-new">
            <div class="speed-value-new" id="velocidadeTxt">0</div>
            <div class="speed-unit-new">KM/H</div>
        </div>

        <!-- PISTA ATÉ O TETO DA TELA -->
        <div class="track-container">
            <div class="track">
                <div id="trackLines" class="track-lines"></div>
            </div>
        </div>
        
        <!-- CARRO GIGANTE COM FAROL VETORIAL (NUNCA VAI BUGAR) -->
        <div class="car-wrapper carro-parado" id="carWrapper">
            
            <!-- Farol Dianteiro desenhado em Vetor 2D (Nasce das laterais do carro) -->
            <svg class="headlight-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="beamGlow" x1="0" y1="1" x2="0" y2="0">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.85)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                    </linearGradient>
                </defs>
                <!-- Feixe Esquerdo -->
                <polygon points="28,100 32,100 -50,0 20,0" fill="url(#beamGlow)" />
                <!-- Feixe Direito -->
                <polygon points="72,100 68,100 150,0 80,0" fill="url(#beamGlow)" />
            </svg>

            <!-- IMAGEM DO CARRO 100% TRANSPARENTE, SEM GAMBIARRAS -->
            <img id="carroImg" src="https://i.imgur.com/8Q5t2Zg.png" alt="Carro Agile" onerror="this.src='https://placehold.co/600x400/transparent/transparent?text='">
            
            <!-- Lanternas Traseiras (Cravadas e Ajustáveis) -->
            <div class="taillight left"></div>
            <div class="taillight right"></div>
        </div>

    </div>

    <!-- ABA 2: LOGO / MÍDIA -->
    <div id="view-logo" class="view-section">
        <img src="https://i.postimg.cc/pT5SLRTR/Gemini-Generated-Image-3en1f93en1f93en1.jpg" class="logo-img-large" alt="Chevrolet Logo Wallpaper">
    </div>

    <!-- ABA 3: MEU AGILE -->
    <div id="view-car" class="view-section">
        <div class="full-screen-display">
            <div class="side-menu">
                <button class="side-menu-btn active" onclick="switchInfoView('info-motor', this)">Motor e Desempenho</button>
                <button class="side-menu-btn" onclick="switchInfoView('info-consumo', this)">Consumo e Autonomia</button>
                <button class="side-menu-btn" onclick="switchInfoView('info-dimensoes', this)">Dimensões e Capacidades</button>
            </div>

            <div class="content-area">
                <div id="info-motor" class="info-section active">
                    <div class="info-title">Motor e Desempenho</div>
                    <div class="info-box-container">
                        <div class="info-box"><div class="info-box-content"><strong>Motorização:</strong> 1.4 8V Econoflex (flex)</div></div>
                        <div class="info-box"><div class="info-box-content"><strong>Potência:</strong> 102 cv a 6.000 rpm</div></div>
                        <div class="info-box"><div class="info-box-content"><strong>Velocidade Máxima:</strong> 166 km/h</div></div>
                    </div>
                </div>

                <div id="info-consumo" class="info-section">
                    <div class="info-title">Consumo e Autonomia</div>
                    <div class="info-box-container">
                        <div class="info-box"><div class="info-box-content"><strong>Consumo Urbano:</strong> 6,6 km/l (Etanol) / 9 km/l (Gasolina)</div></div>
                    </div>
                </div>

                <div id="info-dimensoes" class="info-section">
                    <div class="info-title">Dimensões e Capacidades</div>
                    <div class="info-box-container">
                        <div class="info-box"><div class="info-box-content"><strong>Porta-malas:</strong> 327 litros</div></div>
                    </div>
                </div>

                <div class="car-images-container">
                    <div class="car-image-box"><img src="1.png.png" onerror="this.src='https://placehold.co/400x300/111/ff0033?text=AGILE'" alt="Agile Frente"></div>
                    <div class="car-image-box"><img src="Captura de tela 2026-08-23 002723.png.png" onerror="this.src='https://placehold.co/400x300/111/ff0033?text=AGILE'" alt="Agile Traseira"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(`Erro tela cheia: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) { document.exitFullscreen(); }
        }
    }

    function toggleMenu() {
        document.getElementById('main-nav').classList.toggle('open');
        document.getElementById('menu-btn').classList.toggle('active');
    }

    function switchView(viewId, btnElement) {
        document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        btnElement.classList.add('active');
        document.getElementById('main-nav').classList.remove('open');
        document.getElementById('menu-btn').classList.remove('active');
    }

    function switchInfoView(sectionId, btnElement) {
        document.querySelectorAll('.info-section').forEach(section => section.classList.remove('active'));
        document.querySelectorAll('.side-menu-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(sectionId).classList.add('active');
        btnElement.classList.add('active');
    }

    function atualizarModoDiaNoite() {
        const horaAtual = new Date().getHours();
        const painel = document.getElementById('view-panel');
        if (horaAtual >= 6 && horaAtual < 18) {
            painel.classList.add('light-mode');
        } else {
            painel.classList.remove('light-mode');
        }
    }
    atualizarModoDiaNoite();
    setInterval(atualizarModoDiaNoite, 60000);

    function atualizarRelogio() {
        const agora = new Date();
        const timeElement = document.getElementById('time-display');
        const dateElement = document.getElementById('date-display');

        if(timeElement && dateElement) {
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            timeElement.innerText = `${horas}:${minutos}:${segundos}`;

            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            dateElement.innerText = `${dia}/${mes}/${ano}`;
        }
    }
    atualizarRelogio();
    setInterval(atualizarRelogio, 1000);

    const velDisplay = document.getElementById('velocidadeTxt'); 
    const carWrapper = document.getElementById('carWrapper');
    const trackLines = document.getElementById('trackLines');

    function iniciarGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function(position) {
                    let velMetrosPorSegundo = position.coords.speed;
                    let velKmH = 0;
                    if (velMetrosPorSegundo !== null && velMetrosPorSegundo > 0.3) {
                        velKmH = Math.round(velMetrosPorSegundo * 3.6); 
                    }
                    if(velDisplay) velDisplay.innerText = velKmH;

                    if (velKmH > 0) {
                        if(carWrapper) { carWrapper.classList.add('carro-andando'); carWrapper.classList.remove('carro-parado'); }
                        if(trackLines) trackLines.classList.add('pista-movimento');
                    } else {
                        if(carWrapper) { carWrapper.classList.add('carro-parado'); carWrapper.classList.remove('carro-andando'); }
                        if(trackLines) trackLines.classList.remove('pista-movimento');
                    }
                },
                function(error) { 
                    // Mantém em 0 caso não consiga aceder ao GPS real
                    if(velDisplay) velDisplay.innerText = "0";
                    if(carWrapper) { carWrapper.classList.add('carro-parado'); carWrapper.classList.remove('carro-andando'); }
                    if(trackLines) trackLines.classList.remove('pista-movimento');
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        } else {
            // Fallback para browser sem suporte a GPS
            if(velDisplay) velDisplay.innerText = "0";
            if(carWrapper) { carWrapper.classList.add('carro-parado'); carWrapper.classList.remove('carro-andando'); }
            if(trackLines) trackLines.classList.remove('pista-movimento');
        }
    }
    iniciarGPS();
</script>
</body>
</html>
